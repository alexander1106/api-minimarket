# Blueprint de Render para la API (demo gratis). Render no ofrece MySQL: usa una base externa gratuita (Aiven) y pega
# sus datos en DB_URL, DB_USERNAME y DB_PASSWORD. Las variables con sync: false se piden al crear el servicio.
# DB_URL (Aiven): jdbc:mysql://HOST:PUERTO/defaultdb?sslMode=REQUIRED
services:
  - type: web
    name: minimarket-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # El plan gratuito tiene 512 MB: la JVM se limita para que no la mate Render por falta de memoria
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CRYPTO_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_EMPRESA_PASSWORD
        sync: false
      # Es una demo: carga productos, ventas y cajas de ejemplo la primera vez
      - key: APP_SEED_DEMO
        value: "true"
