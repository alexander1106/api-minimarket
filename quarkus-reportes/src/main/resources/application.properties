quarkus.application.name=quarkus-reportes
quarkus.http.port=${PORT:8081}

# Kafka: consume los eventos que publica api-minimarket al registrar una venta
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.ventas.connector=smallrye-kafka
mp.messaging.incoming.ventas.topic=venta-creada
mp.messaging.incoming.ventas.group.id=quarkus-reportes
mp.messaging.incoming.ventas.auto.offset.reset=earliest
mp.messaging.incoming.ventas.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ventas.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

%test.quarkus.http.test-port=8082
%test.quarkus.kafka.devservices.enabled=false
%test.mp.messaging.incoming.ventas.enabled=false
