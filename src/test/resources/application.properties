spring.datasource.url=jdbc:h2:mem:minimarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jwt.secret=test-secret-test-secret-test-secret-0123456789
jwt.expiration-ms=3600000
app.crypto.key=
app.cors.allowed-origins=*
app.oauth2.enabled=false
app.kafka.enabled=false
app.kafka.topic.venta-creada=venta-creada
upload.dir=./target/test-uploads
apis.net.pe.base-url=https://api.apis.net.pe/v2
management.endpoints.web.exposure.include=health,info
server.error.include-message=always

# los tests crean sus propios datos
app.seed.demo=false
