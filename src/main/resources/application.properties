spring.application.name=api.minimarket

# ---------- Base de datos (MySQL por defecto; ver perfil "sqlserver") ----------
# Los secretos NUNCA van en el repositorio: se leen de variables de entorno (ver .env.example)
# En Railway basta con enlazar el servicio MySQL: se usan MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER y MYSQLPASSWORD.
# En otro proveedor define DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rapimarket_minimarket}?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------- Seguridad ----------
# Secreto HMAC del JWT (minimo 32 caracteres). Definir JWT_SECRET en produccion.
jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
# Clave AES-256 en Base64 (32 bytes) para cifrar datos sensibles (CryptoService)
app.crypto.key=${APP_CRYPTO_KEY:}
# Autorizacion por rol en operaciones de escritura (SUPERADMIN, ADMIN, SUPERVISOR, CAJERO, ALMACENERO, EMPRESA)
app.security.enforce-roles=${APP_ENFORCE_ROLES:true}
# Origenes permitidos para CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
# OAuth2 Resource Server (Keycloak, Auth0, Azure AD...). Requiere issuer-uri.
app.oauth2.enabled=${OAUTH2_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:}

# ---------- Datos iniciales (roles, modulos, permisos y usuario administrador) ----------
# Solo crea lo que falta; nunca modifica ni borra. Cambiar la clave por defecto en produccion.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:alez}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:1234}
app.seed.empresa-username=${APP_SEED_EMPRESA_USERNAME:empresa}
app.seed.empresa-password=${APP_SEED_EMPRESA_PASSWORD:1234}
# Datos de demostracion (productos, ventas, cajas...). Con el perfil prod vienen apagados.
app.seed.demo=${APP_SEED_DEMO:true}

# ---------- Mensajeria (Kafka) ----------
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topic.venta-creada=venta-creada
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=api-minimarket
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ---------- APIs externas (RENIEC / SUNAT) ----------
apis.net.pe.base-url=https://api.apis.net.pe/v2
apis.net.pe.token-ruc=${APIS_TOKEN_RUC:}
apis.net.pe.token-dni=${APIS_TOKEN_DNI:}

# ---------- Correo (recuperacion de contrasena). Sin MAIL_HOST no se envian correos ----------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ---------- Caja ----------
# Exige registrar el arqueo antes de cerrar una apertura de caja
app.caja.exigir-arqueo=${CAJA_EXIGIR_ARQUEO:true}

# ---------- Archivos ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:./uploads}

# ---------- Errores / logs / actuator ----------
# Los proveedores en la nube (Railway, Render...) indican el puerto en la variable PORT
server.port=${PORT:8080}
server.error.include-message=always
logging.level.org.hibernate.SQL=${LOG_SQL:INFO}
management.endpoints.web.exposure.include=health,info
