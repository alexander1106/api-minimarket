# Perfil HTTPS con certificado PKCS12:  --spring.profiles.active=ssl
# Generar con scripts/generar-certificado.sh (o .ps1)
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SSL_KEYSTORE:file:./certs/minimarket.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-alias=minimarket
