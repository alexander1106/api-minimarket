# Perfil de produccion: SPRING_PROFILES_ACTIVE=prod
# Detras del proxy del proveedor: respeta X-Forwarded-* (IP real, https)
server.forward-headers-strategy=native
# Sin datos de demostracion salvo que se pidan expresamente
app.seed.demo=${APP_SEED_DEMO:false}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
# No revelar mensajes internos en los errores 500
server.error.include-message=never
server.error.include-stacktrace=never
